<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Meet Tuition Companion</title>
  <link rel="stylesheet" href="styles.css">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 395px; background: #202124; color: #e8eaed; font-family: "Google Sans", "Segoe UI", Roboto, sans-serif; font-size: 12.5px; padding: 12px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #3c4043; }
.brand, h1, h2, h3 { font-size: 13.5px; font-weight: 600; color: #e8eaed; margin-bottom: 6px; }
.badge, #callStatusBadge { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: #303134; color: #81c995; font-weight: 500; white-space: nowrap; }
.nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #28292c; padding: 4px; border-radius: 999px; border: 1px solid #3c4043; margin-bottom: 10px; }
.nav-tab { background: transparent; color: #9aa0a6; border: none; border-radius: 999px; padding: 6px 4px; font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.nav-tab.active { background: rgba(138,180,248,0.18); color: #8ab4f8; font-weight: 600; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.card { background: #28292c; border: 1px solid #3c4043; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.live-card { text-align: center; background: #303134; }
#timerDisplay, .live-time { font-family: ui-monospace, "Roboto Mono", monospace; font-size: 30px; font-weight: 700; color: #fff; margin: 6px 0 10px; letter-spacing: 1px; }
.btn-row, .quick-offsets { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
button { background: #3c4043; color: #e8eaed; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
button:hover { background: #4d5156; border-color: #8ab4f8; }
#saveProfileBtn, #saveClassroomBtn, #setTimeBtn { background: #8ab4f8; color: #202124; font-weight: 600; border: none; }
input, select { width: 100%; background: #202124; border: 1px solid #5f6368; color: #e8eaed; border-radius: 8px; padding: 6px 8px; font-size: 11.5px; margin-bottom: 6px; outline: none; }
input:focus, select:focus { border-color: #8ab4f8; }
input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: #8ab4f8; }
.profile-form-row, .manual-set-row, .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
.profile-form-row input, .manual-set-row input { margin-bottom: 0; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.kpi-box { background: #303134; border: 1px solid #3c4043; border-radius: 10px; padding: 8px; text-align: center; }
  </style>
</head>
<body class="popup-body">
  <div class="container">
    <header class="header">
      <h1 class="title">🎓 Google Meet Tuition Companion</h1>
      <span id="callStatusBadge" class="status-badge">Not In Call</span>
    </header>

    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="tab-live">⏱ Live</button>
      <button class="nav-tab" data-tab="tab-classrooms">🏫 Classrooms</button>
      <button class="nav-tab" data-tab="tab-tuitions">🎓 History</button>
      <button class="nav-tab" data-tab="tab-settings">☁️ Sync & Rules</button>
    </div>

    <div id="tab-live" class="tab-content active">
      <div class="display-section">
        <div class="info-row">
          <span id="meetingCode">Code: ---</span>
          <span id="liveClassCountChip" class="chip">Class #1</span>
        </div>
        <div id="timerDisplay" class="timer-large">00:00:00</div>
        <div class="btn-group">
          <button id="pauseBtn" class="btn btn-primary">Pause</button>
          <button id="recQuickBtn" class="btn btn-action">⏺ Record</button>
          <button id="hwQuickBtn" class="btn btn-action">✉️ Homework Mail</button>
          <button id="calQuickBtn" class="btn btn-action">📅 Calendar</button>
          <button id="resetBtn" class="btn btn-danger">Reset</button>
        </div>
      </div>

      <div class="section">
        <h3>Active Classroom & Starting Class #</h3>
        <div class="form-grid">
          <input type="text" id="profileLabelInput" placeholder="Class Name">
          <label>This Class #: <input type="number" id="profileCurrentClassNumInput" min="1" value="1"></label>
          <input type="text" id="profileStudentsInput" placeholder="Students">
          <input type="text" id="profileScheduleInput" placeholder="Schedule">
          <input type="text" id="profileEmailsInput" placeholder="Student Emails">
          <button id="saveProfileBtn" class="btn btn-primary">Save Active Profile</button>
          <span id="saveProfileStatus"></span>
        </div>
      </div>

      <div class="section">
        <h3>Manual Timer Adjustment</h3>
        <div class="quick-offsets">
          <button class="offset-btn" data-minutes="-5">-5m</button>
          <button class="offset-btn" data-minutes="-1">-1m</button>
          <button class="offset-btn" data-minutes="1">+1m</button>
          <button class="offset-btn" data-minutes="5">+5m</button>
          <button class="offset-btn" data-minutes="15">+15m</button>
        </div>
        <div class="time-inputs">
          <input type="number" id="inputHh" placeholder="HH" min="0" max="23">
          <input type="number" id="inputMm" placeholder="MM" min="0" max="59">
          <input type="number" id="inputSs" placeholder="SS" min="0" max="59">
          <button id="setTimeBtn" class="btn">Set Time</button>
          <button id="syncBtn" class="btn btn-secondary">Sync</button>
        </div>
      </div>
    </div>

    <div id="tab-classrooms" class="tab-content" style="display:none;">
      <div class="section">
        <h3>Add / Edit Classroom</h3>
        <div class="form-grid">
          <input type="text" id="roomLinkInput" placeholder="Meet Link / Code">
          <label>Prior Classes (Mo): <input type="number" id="roomInitialOffsetInput" min="0" value="0"></label>
          <input type="text" id="roomNameInput" placeholder="Class Name">
          <input type="text" id="roomScheduleInput" placeholder="Schedule">
          <input type="text" id="roomStudentsInput" placeholder="Students">
          <input type="text" id="roomEmailsInput" placeholder="Student Emails">
          <button id="saveClassroomBtn" class="btn btn-primary">Save Classroom</button>
          <span id="roomSaveStatus"></span>
        </div>
      </div>
      <div class="section">
        <h3>Saved Classrooms</h3>
        <div id="classroomList"></div>
      </div>
    </div>

    <div id="tab-tuitions" class="tab-content" style="display:none;">
      <div class="kpi-container">
        <div class="kpi-box"><span id="kpiMonthClasses">0</span><label>This Month</label></div>
        <div class="kpi-box"><span id="kpiTotalClasses">0</span><label>Total Classes</label></div>
        <div class="kpi-box"><span id="kpiTotalHours">0.0h</span><label>Total Hours</label></div>
      </div>
      <div class="section">
        <div class="action-bar">
          <button id="exportCsvBtn" class="btn">Export CSV</button>
          <button id="exportJsonBtn" class="btn">Export JSON</button>
        </div>
        <div id="tuitionCodeList"></div>
      </div>
    </div>

    <div id="tab-settings" class="tab-content" style="display:none;">
      <div class="section">
        <h3>External DB Sync</h3>
        <input type="text" id="googleSheetsUrl" placeholder="Google Sheets Web App URL">
        <div class="btn-group">
          <button id="pushSheetsBtn" class="btn">☁️ Sync to Sheet</button>
          <button id="pullSheetsBtn" class="btn">📥 Restore from Sheet</button>
          <button id="saveDiskNowBtn" class="btn">💾 Save DB to Disk</button>
          <button id="importJsonBtn" class="btn">Import JSON</button>
          <input type="file" id="importJsonFileInput" accept=".json" style="display:none;">
        </div>
      </div>
      <div class="section">
        <h3>Rules & Automation</h3>
        <label>Min Class Minutes: <input type="number" id="minClassMinutes" value="35"></label><br>
        <label>Warn Minutes: <input type="number" id="warnMinutes" value="70"></label><br>
        <label><input type="checkbox" id="autoRecordClass" checked> Auto Record Class</label><br>
        <label><input type="checkbox" id="autoFocusPresentation" checked> Auto Focus Presentation</label><br>
        <label><input type="checkbox" id="autoOpenCalendarTab" checked> Auto Open Calendar Tab</label>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
