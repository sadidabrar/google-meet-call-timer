<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Meet Call Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <div class="container">
    <header class="header">
      <h1 class="title">⏱ Google Meet Call Timer</h1>
      <span id="callStatusBadge" class="status-badge">Not In Call</span>
    </header>

    <div class="display-section">
      <div id="meetingCode" class="meeting-code">Code: ---</div>
      <div id="timerDisplay" class="timer-large">00:00:00</div>
      <div class="btn-group">
        <button id="pauseBtn" class="btn btn-primary">Pause</button>
        <button id="syncBtn" class="btn btn-secondary">⚡ Sync Meet Start</button>
        <button id="resetBtn" class="btn btn-danger">Reset</button>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Manually Adjust Timer</h2>
      <div class="quick-offsets">
        <button data-delta="-300000">-5m</button>
        <button data-delta="-60000">-1m</button>
        <button data-delta="60000">+1m</button>
        <button data-delta="300000">+5m</button>
        <button data-delta="900000">+15m</button>
      </div>
      <div class="time-inputs">
        <input type="number" id="inputHh" min="0" max="99" placeholder="HH" value="00"> :
      
        <input type="number" id="inputMm" min="0" max="59" placeholder="MM" value="00"> :
        <input type="number" id="inputSs" min="0" max="59" placeholder="SS" value="00">
        <button id="setTimeBtn" class="btn btn-primary" style="padding: 4px 10px;">Set Time</button>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Overlay & Alert Settings</h2>
      <div class="form-group">
        <label for="showOverlay">Show in-call floating badge</label>
        <input type="checkbox" id="showOverlay" checked>
      </div>
      <div class="form-group">
        <label for="position">Badge position</label>
        <select id="position">
          <option value="top-center">Top-Middle (Default)</option>
          <option value="top-left">Top-Left</option>
          <option value="top-right">Top-Right</option>
          <option value="bottom-left">Bottom-Left</option>
          <option value="bottom-right">Bottom-Right</option>
        </select>
      </div>
      <div class="form-group">
        <label for="warnMinutes">Overtime alert (minutes)</label>
        <input type="number" id="warnMinutes" min="1" max="600" value="60" style="width: 50px;">
      </div>
      <div class="form-group">
        <label for="soundAlert">Play sound chime on overtime</label>
        <input type="checkbox" id="soundAlert">
      </div>
    </div>

    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 class="section-title">Recent Calls</h2>
        <div style="display: flex; gap: 4px;">
          <button id="exportCsvBtn" class="btn btn-secondary" style="padding: 2px 6px; font-size: 10px;">Export CSV</button>
          <button id="clearHistoryBtn" class="btn btn-danger" style="padding: 2px 6px; font-size: 10px;">Clear</button>
        </div>
      </div>
      <div id="callHistoryList" class="history-list">
        <div style="font-size: 11px; color: #9aa0a6; text-align: center; padding: 8px;">No recent call records</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
