<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Meet Tuition Companion</title>
  <link rel="stylesheet" href="styles.css">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 400px; background: #202124; color: #e8eaed; font-family: "Google Sans", "Segoe UI", Roboto, sans-serif; font-size: 12.5px; padding: 12px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #3c4043; }
.brand, h1, h2, h3 { font-size: 13.5px; font-weight: 600; color: #e8eaed; margin-bottom: 6px; } .header .title { font-size: 14px; white-space: nowrap; margin-bottom: 0; }
.badge, #callStatusBadge { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: #303134; color: #81c995; font-weight: 500; white-space: nowrap; }
.nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; width: 100%; overflow: hidden; background: #28292c; padding: 4px; border-radius: 999px; border: 1px solid #3c4043; margin-bottom: 10px; }
.nav-tab { background: transparent; color: #9aa0a6; border: none; border-radius: 999px; padding: 6px 4px !important; font-size: 11px !important; font-weight: 500; cursor: pointer; white-space: nowrap; text-align: center; width: 100% !important; min-width: 0; }
.nav-tab.active { background: rgba(138,180,248,0.18); color: #8ab4f8; font-weight: 600; }
.tab-pane, .tab-content { display: none !important; }
.tab-pane.active, .tab-content.active { display: block !important; }
.card { background: #28292c; border: 1px solid #3c4043; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.live-card { text-align: center; background: #303134; }
#timerDisplay, .live-time { font-family: ui-monospace, "Roboto Mono", monospace; font-size: 30px; font-weight: 700; color: #fff; margin: 6px 0 10px; letter-spacing: 1px; }
.btn-row { display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 6px !important; margin-top: 8px !important; } .btn-group { display: flex !important; flex-wrap: nowrap !important; justify-content: center !important; gap: 5px !important; margin-top: 8px !important; } .btn-group button, .btn-group .btn { width: auto !important; flex: 0 1 auto !important; padding: 6px 9px !important; font-size: 11px !important; border-radius: 9999px !important; white-space: nowrap !important; } #pauseBtn, #calQuickBtn { background: rgba(138, 180, 248, 0.16) !important; color: #8ab4f8 !important; border: 1px solid rgba(138, 180, 248, 0.35) !important; } #recQuickBtn { background: rgba(242, 139, 130, 0.16) !important; color: #f28b82 !important; border: 1px solid rgba(242, 139, 130, 0.35) !important; } #hwQuickBtn { background: rgba(129, 201, 149, 0.16) !important; color: #81c995 !important; border: 1px solid rgba(129, 201, 149, 0.35) !important; } #resetBtn { background: #3c4043 !important; color: #e8eaed !important; border: 1px solid #5f6368 !important; } .quick-offsets { display: grid !important; grid-template-columns: repeat(5, 1fr) !important; gap: 5px !important; margin-top: 8px !important; margin-bottom: 6px !important; } .quick-offsets button { width: 100% !important; padding: 6px 4px !important; font-size: 11px !important; } .time-inputs { display: flex !important; align-items: center !important; gap: 6px !important; } .time-inputs input { flex: 1 !important; min-width: 0 !important; margin-bottom: 0 !important; text-align: center; } .time-inputs button { width: auto !important; flex: none !important; white-space: nowrap !important; } .form-row { display: flex !important; align-items: center !important; gap: 6px !important; margin-bottom: 6px !important; } .form-row input { flex: 1 !important; min-width: 0 !important; margin-bottom: 0 !important; } .form-row .inline-label { white-space: nowrap !important; font-size: 11px !important; color: #9aa0a6; flex: none !important; } #profileCurrentClassNumInput, #roomInitialOffsetInput { width: 54px !important; flex: none !important; text-align: center !important; } button.btn-save { width: auto !important; flex: none !important; padding: 6px 14px !important; border-radius: 9999px !important; background: #8ab4f8 !important; color: #202124 !important; font-weight: 600 !important; white-space: nowrap !important; }
button, .btn { width: auto !important; height: auto !important; border-radius: 999px !important; padding: 6px 12px !important; font-size: 11.5px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; gap: 4px !important; }
button:hover { background: #4d5156; border-color: #8ab4f8; }
#saveProfileBtn, #saveClassroomBtn, #setTimeBtn { background: #8ab4f8; color: #202124; font-weight: 600; border: none; }
input, select { width: 100% !important; background: #202124 !important; color: #e8eaed !important; border: 1px solid #5f6368 !important; border-radius: 8px !important; padding: 6px 8px !important; margin-bottom: 6px !important; }
input:focus, select:focus { border-color: #8ab4f8; }
input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: #8ab4f8; }
.profile-form-row, .manual-set-row, .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
.profile-form-row input, .manual-set-row input { margin-bottom: 0; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.kpi-box { background: #303134; border: 1px solid #3c4043; border-radius: 10px; padding: 8px; text-align: center; }
  </style>
</head>
<body class="popup-body">
  <div class="container">
    <header class="header">
      <h1 class="title">🎓 Google Meet Tuition Companion</h1>
      <span id="callStatusBadge" class="status-badge">Not In Call</span>
    </header>

    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="tab-live">⏱ Live</button>
      <button class="nav-tab" data-tab="tab-classrooms">🏫 Classrooms</button>
      <button class="nav-tab" data-tab="tab-tuitions">🎓 History</button>
      <button class="nav-tab" data-tab="tab-settings">☁️ Sync & Rules</button>
    </div>

    <div id="tab-live" class="tab-content active">
      <div class="display-section">
        <div class="info-row">
          <span id="meetingCode">Code: ---</span>
          <span id="liveClassCountChip" class="chip">Class #1</span>
        </div>
        <div id="timerDisplay" class="timer-large">00:00:00</div>
        <div class="btn-group">
          <button id="pauseBtn" class="btn btn-primary">Pause</button>
          <button id="recQuickBtn" class="btn btn-action">⏺ Record</button>
          <button id="hwQuickBtn" class="btn btn-action">✉️ Homework</button>
          <button id="calQuickBtn" class="btn btn-action">📅 Calendar</button>
          <button id="resetBtn" class="btn btn-danger">Reset</button>
        </div>
      </div>

      <div class="section">
        <h3>Active Classroom & Starting Class #</h3>
        <div class="form-grid">
          <div class="form-row"><input type="text" id="profileLabelInput" placeholder="Class Name">
          <label class="inline-label">This Class #:</label><input type="number" id="profileCurrentClassNumInput" min="1" value="1"></div>
          <div class="form-row"><input type="text" id="profileStudentsInput" placeholder="Students">
          <input type="text" id="profileScheduleInput" placeholder="Schedule"></div>
          <div class="form-row"><input type="text" id="profileEmailsInput" placeholder="Student Emails">
          <button id="saveProfileBtn" class="btn btn-primary btn-save">Save Active Profile</button></div>
          <span id="saveProfileStatus"></span>
        </div>
      </div>

      <div class="section">
        <h3>Manual Timer Adjustment</h3>
        <div class="quick-offsets">
          <button class="offset-btn" data-minutes="-5">-5m</button>
          <button class="offset-btn" data-minutes="-1">-1m</button>
          <button class="offset-btn" data-minutes="1">+1m</button>
          <button class="offset-btn" data-minutes="5">+5m</button>
          <button class="offset-btn" data-minutes="15">+15m</button>
        </div>
        <div class="time-inputs">
          <input type="number" id="inputHh" placeholder="HH" min="0" max="23">
          <input type="number" id="inputMm" placeholder="MM" min="0" max="59">
          <input type="number" id="inputSs" placeholder="SS" min="0" max="59">
          <button id="setTimeBtn" class="btn">Set Time</button>
          <button id="syncBtn" class="btn btn-secondary">Sync</button>
        </div>
      </div>
    </div>

    <div id="tab-classrooms" class="tab-content" style="display:none;">
      <div class="section">
        <h3>Add / Edit Classroom</h3>
        <div class="form-grid">
          <div class="form-row"><input type="text" id="roomLinkInput" placeholder="Meet Link / Code">
          <label class="inline-label">Prior Classes (Mo):</label><input type="number" id="roomInitialOffsetInput" min="0" value="0"></div>
          <div class="form-row"><input type="text" id="roomNameInput" placeholder="Class Name">
          <input type="text" id="roomScheduleInput" placeholder="Schedule"></div>
          <div class="form-row"><input type="text" id="roomStudentsInput" placeholder="Students">
          <input type="text" id="roomEmailsInput" placeholder="Student Emails">
          <button id="saveClassroomBtn" class="btn btn-primary btn-save">Save Classroom</button></div>
          <span id="roomSaveStatus"></span>
        </div>
      </div>
      <div class="section">
        <h3>Saved Classrooms</h3>
        <div id="classroomList"></div>
      </div>
    </div>

    <div id="tab-tuitions" class="tab-content" style="display:none;">
      <div class="kpi-container">
        <div class="kpi-box"><span id="kpiMonthClasses">0</span><label>This Month</label></div>
        <div class="kpi-box"><span id="kpiTotalClasses">0</span><label>Total Classes</label></div>
        <div class="kpi-box"><span id="kpiTotalHours">0.0h</span><label>Total Hours</label></div>
      </div>
      <div class="section">
        <div class="action-bar">
          <button id="exportCsvBtn" class="btn">Export CSV</button>
          <button id="exportJsonBtn" class="btn">Export JSON</button>
        </div>
        <div id="tuitionCodeList"></div>
      </div>
    </div>

    <div id="tab-settings" class="tab-content" style="display:none;">
      <div class="section">
        <h3>External DB Sync</h3>
        <input type="text" id="googleSheetsUrl" placeholder="Google Sheets Web App URL">
        <div class="btn-group">
          <button id="pushSheetsBtn" class="btn">☁️ Sync to Sheet</button>
          <button id="pullSheetsBtn" class="btn">📥 Restore from Sheet</button>
          <button id="saveDiskNowBtn" class="btn">💾 Save DB to Disk</button>
          <button id="importJsonBtn" class="btn">Import JSON</button>
          <input type="file" id="importJsonFileInput" accept=".json" style="display:none;">
        </div>
      </div>
      <div class="section">
        <h3>Rules & Automation</h3>
        <label>Min Class Minutes: <input type="number" id="minClassMinutes" value="35"></label><br>
        <label>Warn Minutes: <input type="number" id="warnMinutes" value="70"></label><br>
        <label><input type="checkbox" id="autoRecordClass" checked> Auto Record Class</label><br>
        <label><input type="checkbox" id="autoFocusPresentation" checked> Auto Focus Presentation</label><br>
        <label><input type="checkbox" id="autoOpenCalendarTab" checked> Auto Open Calendar Tab</label>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
